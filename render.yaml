services:
  - type: web
    name: telegram-post-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TZ
        value: Asia/Kolkata
      - key: PYTHON_VERSION
        value: 3.12.7
