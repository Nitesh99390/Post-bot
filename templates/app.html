<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Post Bot · Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#0f1115);--sec:var(--tg-theme-secondary-bg-color,#1a1d24);
  --text:var(--tg-theme-text-color,#f2f3f5);--hint:var(--tg-theme-hint-color,#8b93a1);
  --accent:var(--tg-theme-button-color,#5b8def);--accent-fg:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-link-color,#6ea8fe);--r:18px;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);
  padding:0 16px calc(24px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
header h1{font-size:22px;margin:0;letter-spacing:-.3px}
header .sub{color:var(--hint);font-size:13px;margin-top:2px}
.badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.badge.admin{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}

.tabs{display:flex;background:var(--sec);border-radius:14px;padding:4px;margin-bottom:16px;position:sticky;top:8px;z-index:5;backdrop-filter:blur(12px)}
.tab{flex:1;text-align:center;padding:10px 0;font-size:14px;font-weight:600;color:var(--hint);border-radius:11px;cursor:pointer;transition:.2s}
.tab.on{background:var(--accent);color:var(--accent-fg);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--sec);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset:auto -20px -30px auto;width:90px;height:90px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-1px}.stat .l{color:var(--hint);font-size:12px;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

.card{background:var(--sec);border-radius:var(--r);padding:16px;margin-bottom:12px;animation:in .35s ease both}
.card.mine{border-left:3px solid var(--ok)}
.card .txt{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.45;max-height:120px;overflow:hidden;position:relative}
.card .txt.open{max-height:none}
.card .txt:not(.open).long::after{content:"";position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--sec))}
.more{color:var(--link);font-size:13px;font-weight:600;margin-top:4px;cursor:pointer;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:10px;background:var(--bg);display:inline-flex;align-items:center;gap:6px;color:var(--text);text-decoration:none;max-width:100%}
.chip.lock{color:var(--hint)}
.chip a{color:var(--link);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.chip .cp{cursor:pointer;opacity:.7}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--hint)}
.meta b{color:var(--text)}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--hint) 18%,transparent)}
.row:last-child{border:0}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--bg);flex-shrink:0}
.rank.g{background:linear-gradient(135deg,#f7c948,#e8a400);color:#3b2b00}.rank.s{background:linear-gradient(135deg,#d9dde3,#a4acb8);color:#222}.rank.b{background:linear-gradient(135deg,#e0a26e,#b26a33);color:#fff}
.row .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{height:5px;border-radius:3px;background:var(--bg);margin-top:6px;overflow:hidden}.row .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.row .c{font-weight:800;color:var(--accent);font-size:14px}

.search{width:100%;padding:12px 14px;border-radius:13px;border:0;background:var(--sec);color:var(--text);font-size:15px;outline:none;margin-bottom:12px}
.filters{display:flex;gap:8px;margin-bottom:14px}
.f{font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--sec);color:var(--hint);cursor:pointer}
.f.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.empty{text-align:center;color:var(--hint);padding:40px 0;font-size:14px}
.sk{background:linear-gradient(90deg,var(--sec) 25%,color-mix(in srgb,var(--sec) 60%,var(--bg)) 50%,var(--sec) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r);height:90px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <div><h1>📮 Post Bot</h1><div class="sub" id="hello">Loading…</div></div>
  <span class="badge" id="role">Guest</span>
</header>

<div class="tabs">
  <div class="tab on" data-t="home">Overview</div>
  <div class="tab" data-t="lb">Leaderboard</div>
  <div class="tab" data-t="posts">Posts</div>
</div>

<section id="home">
  <div class="grid">
    <div class="stat"><div class="v" id="s-posts">–</div><div class="l">Total posts</div></div>
    <div class="stat"><div class="v" id="s-users">–</div><div class="l">Creators</div></div>
    <div class="stat"><div class="v" id="s-mine">–</div><div class="l">My posts</div></div>
    <div class="stat"><div class="v" id="s-rank">–</div><div class="l">My rank</div></div>
  </div>
  <div class="card" id="top3"><div class="sk" style="height:60px;margin:0"></div></div>
</section>

<section id="lb" class="hide"><div class="card" id="lb-list"></div></section>

<section id="posts" class="hide">
  <input class="search" id="q" placeholder="🔍 Search posts or buttons…">
  <div class="filters"><span class="f on" data-f="all">All</span><span class="f" data-f="mine">Mine</span></div>
  <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</section>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
tg.setHeaderColor?.('secondary_bg_color');
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hap = t => tg.HapticFeedback?.impactOccurred(t || 'light');
let DATA = null, filter = 'all';

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1600); }
function copy(t){ navigator.clipboard?.writeText(t).then(()=>{toast('Copied ✓');hap('medium')}); }
function since(iso){ if(!iso) return ''; const s=(Date.now()-new Date(iso))/1e3;
  return s<60?'just now':s<3600?`${s/60|0}m ago`:s<86400?`${s/3600|0}h ago`:`${s/86400|0}d ago`; }

document.querySelectorAll('.tab').forEach(t => t.onclick = () => { hap();
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('hide',s.id!==t.dataset.t)); });
document.querySelectorAll('.f').forEach(f => f.onclick = () => { hap(); filter=f.dataset.f;
  document.querySelectorAll('.f').forEach(x=>x.classList.toggle('on',x===f)); renderPosts(); });
$('#q').oninput = renderPosts;

function renderStats(){
  const {me,stats,leaderboard,posts} = DATA;
  $('#hello').textContent = `Welcome back, ${me.name || 'Guest'}`;
  $('#role').textContent = me.admin ? 'Admin' : me.id ? 'Creator' : 'Guest'; $('#role').classList.toggle('admin', me.admin);
  $('#s-posts').textContent = stats.posts; $('#s-users').textContent = stats.users;
  $('#s-mine').textContent = posts.filter(p=>p.mine).length;
  const r = leaderboard.findIndex(u=>u.id===me.id); $('#s-rank').textContent = r>=0 ? `#${r+1}` : '—';
  $('#top3').innerHTML = leaderboard.length ? `<div style="font-weight:700;margin-bottom:6px">🏆 Top creators</div>` + rows(leaderboard.slice(0,3)) : `<div class="empty">No creators yet</div>`;
  $('#lb-list').innerHTML = leaderboard.length ? rows(leaderboard) : `<div class="empty">Leaderboard is empty</div>`;
}
function rows(list){ const max = list[0]?.total_posts || 1;
  return list.map((u,i)=>`<div class="row"><div class="rank ${['g','s','b'][i]||''}">${i+1}</div>
    <div class="n">${esc(u.username||'Unknown')}${u.id===DATA.me.id?' <span class="badge">you</span>':''}<div class="bar"><i style="width:${u.total_posts/max*100}%"></i></div></div>
    <div class="c">${u.total_posts}</div></div>`).join(''); }

function renderPosts(){
  const q = $('#q').value.toLowerCase();
  const list = DATA.posts.filter(p => (filter==='all'||p.mine) && (!q || p.plain.toLowerCase().includes(q) || p.buttons.some(b=>b.name.toLowerCase().includes(q))));
  $('#list').innerHTML = list.length ? list.map((p,i)=>`
    <div class="card ${p.mine?'mine':''}" style="animation-delay:${Math.min(i,8)*40}ms">
      <div class="txt ${p.plain.length>220?'long':''}">${esc(p.plain)}</div>
      ${p.plain.length>220?`<span class="more" onclick="this.previousElementSibling.classList.toggle('open');this.textContent=this.textContent==='Show more'?'Show less':'Show more'">Show more</span>`:''}
      <div class="chips">${p.buttons.map(b => b.url
        ? `<span class="chip">🔗 <a href="${esc(b.url)}" target="_blank">${esc(b.name)}</a><span class="cp" onclick="copy('${esc(b.url)}')">⧉</span></span>`
        : `<span class="chip lock">🔒 ${esc(b.name)}</span>`).join('')}</div>
      <div class="meta"><span>${p.mine?'<b>You</b>':'ID '+p.user_id}</span><span>${since(p.created_at)}</span></div>
    </div>`).join('') : `<div class="empty">Nothing found</div>`;
}

fetch('/api/data', {headers:{'X-Init-Data': tg.initData || ''}})
  .then(r=>r.json()).then(d=>{ DATA=d; renderStats(); renderPosts(); })
  .catch(()=>{ $('#hello').textContent='Failed to load'; $('#list').innerHTML='<div class="empty">⚠️ Could not reach server</div>'; });
</script>
</body>
</html>
